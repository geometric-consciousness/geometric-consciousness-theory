<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Electroweak boundary and flow audit</title>
  <desc id="desc">The conditional phi minus three ultraviolet boundary, the two non-closing low-energy flow audits, and the observed Z-pole value.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b23a3a"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #20242a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #4b5563; }
      .axis { stroke: #343a40; stroke-width: 2; }
      .tick { stroke: #6b7280; stroke-width: 1; }
      .ticktext { font: 13px Arial, sans-serif; fill: #4b5563; text-anchor: middle; }
      .label { font: 700 15px Arial, sans-serif; fill: #20242a; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .bad { fill: #b23a3a; stroke: #7f1d1d; stroke-width: 2; }
      .obs { fill: #2563a6; stroke: #173d63; stroke-width: 2; }
      .hyp { fill: #d4a72c; stroke: #7a5b00; stroke-width: 2; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="518" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="450" y="42" class="title" text-anchor="middle">The Electroweak Boundary Problem</text>
  <text x="450" y="68" class="subtitle" text-anchor="middle">H-EW is a Tier 3 gauge-kinetic hypothesis; neither current flow route reconstructs the Z-pole.</text>

  <!-- comparison axis -->
  <line x1="80" y1="370" x2="820" y2="370" class="axis"/>
  <text x="450" y="414" class="small" text-anchor="middle">dimensionless sin²θW value (UV boundary and IR outputs shown for audit only)</text>
  <g>
    <line x1="80" y1="363" x2="80" y2="378" class="tick"/><text x="80" y="397" class="ticktext">0.12</text>
    <line x1="194" y1="363" x2="194" y2="378" class="tick"/><text x="194" y="397" class="ticktext">0.14</text>
    <line x1="308" y1="363" x2="308" y2="378" class="tick"/><text x="308" y="397" class="ticktext">0.16</text>
    <line x1="422" y1="363" x2="422" y2="378" class="tick"/><text x="422" y="397" class="ticktext">0.18</text>
    <line x1="535" y1="363" x2="535" y2="378" class="tick"/><text x="535" y="397" class="ticktext">0.20</text>
    <line x1="649" y1="363" x2="649" y2="378" class="tick"/><text x="649" y="397" class="ticktext">0.22</text>
    <line x1="763" y1="363" x2="763" y2="378" class="tick"/><text x="763" y="397" class="ticktext">0.24</text>
  </g>

  <!-- candidate UV boundary -->
  <path d="M741 122 l11 18 -11 18 -11 -18 z" class="hyp"/>
  <text x="741" y="92" class="label" text-anchor="middle">H-EW candidate UV boundary: φ⁻³ = 0.236068</text>
  <text x="741" y="111" class="tiny" text-anchor="middle">not derived by the canonical projectors</text>

  <!-- failed flow arrows -->
  <path d="M732 152 C660 215, 520 250, 384 336" fill="none" stroke="#b23a3a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <path d="M730 148 C560 190, 330 230, 198 336" fill="none" stroke="#b23a3a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>

  <!-- outputs -->
  <circle cx="175" cy="350" r="9" class="bad"/>
  <text x="185" y="290" class="label" text-anchor="end">SM one-loop comparator</text>
  <text x="185" y="310" class="small" text-anchor="end">0.136725 · 40.87% low</text>

  <circle cx="362" cy="350" r="9" class="bad"/>
  <text x="368" y="290" class="label" text-anchor="end">native calibrated kernel</text>
  <text x="368" y="310" class="small" text-anchor="end">0.169569 · 26.66% low</text>

  <!-- observed endpoint -->
  <circle cx="713" cy="350" r="9" class="obs"/>
  <text x="690" y="300" class="label" text-anchor="end">observed Z-pole</text>
  <text x="690" y="320" class="small" text-anchor="end">0.23122</text>

  <rect x="80" y="442" width="740" height="50" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="450" y="464" class="small" text-anchor="middle">Surviving closure target: derive normalized SU(2)/U(1) kinetic coefficients and beta functions from the 6D action,</text>
  <text x="450" y="483" class="small" text-anchor="middle">then predict multiple low-energy observables without using them to normalize the flow.</text>
</svg>
