[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gct-physics-engine"
version = "1.0.0"
description = "Numerical engine accompanying the Geometric Consciousness Theory monograph. Reproducible numerical checks of the monograph's tiered claims: lepton mass ratios, bare gauge-coupling handles, mixing-angle ansaetze, and selected cosmological observables, computed from a 6D icosahedral cut-and-project lattice plus CODATA / PDG anchors. Each output carries its tier; Tier 3 hypotheses are tested, not established."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [
    { name = "Pablo González Acosta" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "sympy>=1.12",
    "biopython>=1.81",
    "pyphi==1.2.0",
]

[project.urls]
Documentation = "see ../content/98_Global_Appendices/App_GPE_Physics_Engine.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
